<script>

let mods = JSON.parse(
localStorage.getItem("cinarfarming_mods") || "[]"
);

let cur = "ALL";

function esc(s){

return String(s).replace(
/[&<>"']/g,

function(x){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[x];

}

);

}

function isAdmin(){

return localStorage.getItem("cinarfarming_admin") === "1";

}

function render(){

let list =
cur === "ALL"
? mods
: mods.filter(x => x.game === cur);

const box =
document.getElementById("mods");

if(!list.length){

box.innerHTML = `
<div style="
grid-column:1/-1;
padding:50px;
text-align:center;
border:1px dashed #1e4560;
border-radius:18px;
color:#8ea1b5;
">

<div style="
font-size:40px;
margin-bottom:12px;
">
📦
</div>

<h3 style="margin-bottom:8px;color:#dcefff">
Henüz mod eklenmedi.
</h3>

<p>
Yönetici panelinden mod eklediğinde
burada görünecek.
</p>

</div>
`;

return;

}

box.innerHTML =
list.map(x => `

<article class="mod">

<span class="tag">
${esc(x.game)} · ${esc(x.type)}
</span>

<h3>
${esc(x.name)}
</h3>

<p>
${esc(x.description || "Farming Simulator modu")}
</p>

<a
href="${esc(x.url)}"
target="_blank"
rel="noopener"
>
MODU AÇ →
</a>

${
isAdmin()
?
`
<button
onclick="deleteMod(${Number(x.id)})"
style="
margin-top:12px;
padding:10px 14px;
border:1px solid #ff365f;
border-radius:8px;
background:#ff365f12;
color:#ff5275;
font-weight:800;
cursor:pointer;
"
>
🗑️ MODU SİL
</button>
`
:
""
}

</article>

`).join("");

}

function deleteMod(id){

if(!isAdmin()){

alert("❌ Bu işlem sadece yöneticiye açıktır.");

return;

}

const mod =
mods.find(x => Number(x.id) === Number(id));

if(!mod){

alert("❌ Mod bulunamadı.");

return;

}

const confirmDelete =
confirm(
"⚠️ Bu modu silmek istediğine emin misin?\n\n" +
mod.name +
"\n" +
mod.game
);

if(!confirmDelete){

return;

}

mods =
mods.filter(
x => Number(x.id) !== Number(id)
);

localStorage.setItem(
"cinarfarming_mods",
JSON.stringify(mods)
);

render();

alert(
"🗑️ " +
mod.name +
" başarıyla silindi."
);

}

function filterMods(game,button){

cur = game;

document
.querySelectorAll(".filters button")
.forEach(x =>
x.classList.remove("on")
);

button.classList.add("on");

render();

}

function setGame(game){

cur = game;

document
.querySelectorAll(".filters button")
.forEach(button => {

button.classList.toggle(
"on",
button.textContent.trim() === game
);

});

render();

}

const ADMIN_USERNAME = "FENERBAHÇE03";

const ADMIN_PASSWORD =
"79946698469767964655bhfh7237vwşxçwhwrscd";

function loginAdmin(){

const user =
document.getElementById("adminUser").value.trim();

const entered =
document.getElementById("adminPass").value;

if(
user === ADMIN_USERNAME &&
entered === ADMIN_PASSWORD
){

localStorage.setItem(
"cinarfarming_admin",
"1"
);

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(
"adminPanel"
).style.display = "block";

render();

alert("✅ Yönetici girişi başarılı!");

}

else{

alert(
"❌ Kullanıcı adı veya şifre yanlış."
);

document.getElementById(
"adminPass"
).value = "";

}

}

function restoreAdmin(){

if(
localStorage.getItem("cinarfarming_admin")
===
"1"
){

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(
"adminPanel"
).style.display = "block";

}

}

function addMod(){

if(!isAdmin()){

alert(
"❌ Bu işlem sadece yöneticiye açıktır."
);

return;

}

const nameEl =
document.getElementById("name");

const gameEl =
document.getElementById("game");

const typeEl =
document.getElementById("type");

const urlEl =
document.getElementById("url");

const name =
nameEl.value.trim();

const game =
gameEl.value;

const type =
typeEl.value;

const url =
urlEl.value.trim();

if(!name){

alert(
"❌ Mod adını yaz kral."
);

nameEl.focus();

return;

}

if(!url){

alert(
"❌ Mod bağlantısını yaz kral."
);

urlEl.focus();

return;

}

if(
!/^https?:\/\//i.test(url)
){

alert(
"❌ Link https:// veya http:// ile başlamalı."
);

urlEl.focus();

return;

}

const newMod = {

id:Date.now(),

name:name,

game:game,

type:type,

url:url,

description:
game + " için " + type + " modu."

};

mods.unshift(newMod);

localStorage.setItem(
"cinarfarming_mods",
JSON.stringify(mods)
);

nameEl.value = "";
urlEl.value = "";

cur = game;

document
.querySelectorAll(".filters button")
.forEach(button => {

button.classList.toggle(
"on",
button.textContent.trim() === game
);

});

render();

alert(
"✅ " +
game +
" modu başarıyla eklendi!"
);

}

localStorage.removeItem(
"cinaryazilim_mods"
);

localStorage.removeItem(
"cinarfarmingmods_fs25"
);

mods =
JSON.parse(
localStorage.getItem("cinarfarming_mods") || "[]"
);

render();

restoreAdmin();

render();

</script>
